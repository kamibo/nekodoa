[build]
target = "xtensa-esp32-none-elf"
rustflags = ["-C", "link-arg=-nostartfiles"]

[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32 --monitor-baud 115200 --log-format serial"

[unstable]
build-std = ["alloc", "core"]

[env]
ESP_LOG = "info"
# Captured ARCELI module frames use DHT11 integer/fraction bytes.
DHT_MODEL = "DHT11"
