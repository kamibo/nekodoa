[package]
name = "nekodoa"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "nekodoa"
path = "src/main.rs"
test = false
bench = false

[dependencies]
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp"] }
esp32 = { version = "0.41.0", default-features = false }
embassy-time = "0.5.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["esp32", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }
esp-radio = { version = "0.18.0", features = ["esp32", "wifi"] }
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy", "esp-radio", "esp-alloc"] }
log = "0.4.27"
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
